<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E40AF">
<title>تسجيل الدخول — منصة تواصل</title>
<link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
<script src="/runtime-config.js"></script>
<!-- The approved typeface, served from this origin. This page previously pulled IBM Plex
     Sans Arabic and Inter from the Google Fonts CDN: off-brand faces, a third-party request
     from the sign-in page of a government platform, and a hard failure behind a corporate
     firewall that would drop the login screen to a system font. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/frutiger/FrutigerLTArabic-Roman.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/frutiger/FrutigerLTArabic-Bold.woff2" crossorigin>
<link rel="stylesheet" href="/css/dga.css">
<style>
:root {
  --primary:        #1E40AF;
  --primary-hover:  #1E3A8A;
  --primary-50:     #EFF6FF;
  --primary-100:    #DBEAFE;
  --bg:             #F0F4FF;
  --surface:        #FFFFFF;
  --border:         #E5E7EB;
  --border-focus:   #1E40AF;
  --text:           #0F172A;
  --text-2:         #334155;
  --text-3:         #64748B;
  --text-4:         #94A3B8;
  --danger:         #DC2626;
  --danger-bg:      #FEF2F2;
  --success:        #16A34A;
  --success-bg:     #F0FDF4;
  --sans: 'Frutiger LT Arabic', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image:
    radial-gradient(at 0% 0%, rgba(30,64,175,0.06) 0px, transparent 60%),
    radial-gradient(at 100% 100%, rgba(99,102,241,0.06) 0px, transparent 60%);
}

.login-wrap {
  width: 100%;
  max-width: 420px;
}

.login-brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-logo {
  width: 56px; height: 56px;
  background: var(--primary);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(30,64,175,0.25);
}
.brand-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.brand-sub {
  font-size: 12.5px;
  color: var(--text-3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-family: var(--sans);
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
}

.login-heading {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 28px;
}

.field {
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 7px;
}
.field-input-wrap {
  position: relative;
}
.field input {
  width: 100%;
  height: 44px;
  padding: 0 42px 0 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(30,64,175,0.1);
}
.field-icon {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-4);
  pointer-events: none;
  width: 17px; height: 17px;
}
.field-icon svg { width: 100%; height: 100%; stroke-width: 2; }
.toggle-pass {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-4);
  /* 44x44 hit area (WCAG 2.5.5) while the glyph stays visually at 13px inset */
  padding: 0 13px;
  width: 44px; height: 44px;
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box;
}
.toggle-pass:hover { color: var(--text-2); }
.toggle-pass svg { width: 17px; height: 17px; stroke-width: 2; }

.field-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.checkbox-wrap input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
  flex-shrink: 0;
}
/* Keep the whole label row a comfortable target */
.checkbox-wrap { min-height: 44px; }
.checkbox-wrap span {
  font-size: 13px;
  color: var(--text-2);
}

.btn-login {
  width: 100%;
  height: 46px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover:not(:disabled) { background: var(--primary-hover); }
.btn-login:active:not(:disabled) { transform: scale(0.99); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

.alert {
  display: none;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 18px;
  align-items: flex-start;
  gap: 9px;
}
.alert.show { display: flex; }
.alert.error { background: var(--danger-bg); color: var(--danger); border: 1px solid #FECACA; }
.alert.success { background: var(--success-bg); color: var(--success); border: 1px solid #BBF7D0; }
.alert-icon { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.alert-icon svg { width: 100%; height: 100%; stroke-width: 2; }

.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sso-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: var(--text-4);
  font-size: 12px;
}
.sso-divider::before,
.sso-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-sso {
  width: 100%;
  height: 44px;
  background: var(--surface);
  color: var(--text-2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
}
.btn-sso:hover { border-color: #0078D4; background: #F0F7FF; color: #0078D4; }
.btn-sso:active { transform: scale(0.99); }
.btn-sso:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-sso .sso-icon { width: 18px; height: 18px; flex-shrink: 0; }

#sso-section { display: none; }

.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11.5px;
  color: var(--text-4);
}

/* ══════════════════════════════════════════════════════════════════
   RESPONSIVE — small-screen spacing
   The card must breathe on a 375px phone and stay scrollable on short
   viewports (the login form is taller than a landscape phone).
   ══════════════════════════════════════════════════════════════════ */
@media (max-width: 600px) {
  body {
    align-items: flex-start;
    padding: 24px 16px 32px;
    min-height: 100dvh;
  }
  .login-wrap { max-width: 100%; }
  .login-brand { margin-bottom: 24px; }
  .brand-logo { width: 50px; height: 50px; }
  .login-card { padding: 24px 18px; border-radius: 14px; }
  .login-heading { font-size: 17px; }
  .login-sub { font-size: 12.5px; margin-bottom: 22px; }
  .field { margin-bottom: 16px; }
  .field-options { margin-bottom: 20px; }
  .sso-divider { margin: 18px 0; }
  .login-footer { margin-top: 18px; }
}

@media (max-width: 380px) {
  body { padding: 18px 12px 26px; }
  .login-card { padding: 20px 14px; border-radius: 12px; }
  .login-heading { font-size: 16px; }
  .field label { font-size: 12.5px; }
  .checkbox-wrap span { font-size: 12.5px; }
  .brand-sub { font-size: 10px; }
}

/* Short viewports (landscape phones): let the page scroll instead of clipping */
@media (max-height: 620px) {
  body { align-items: flex-start; padding-top: 20px; padding-bottom: 28px; }
}

/* ══════════════════════════════════════════════════════════════════
   TOUCH TARGETS — 44x44 minimum on touch-primary devices
   16px inputs also stop iOS Safari from zooming on focus.
   ══════════════════════════════════════════════════════════════════ */
@media (hover: none) and (pointer: coarse) {
  .field input,
  #user-type,
  select {
    min-height: 44px;
    height: 44px;
    font-size: 16px;
  }
  .btn-login { min-height: 46px; }
  .btn-sso { min-height: 44px; }
  .toggle-pass { width: 44px; height: 44px; }
  .checkbox-wrap { min-height: 44px; }
  .checkbox-wrap input[type="checkbox"] { width: 22px; height: 22px; }
  .login-footer a { display: inline-block; min-height: 44px; line-height: 44px; }
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-logo">GAC</div>
    <div class="brand-title">منصة تواصل</div>
    <div class="brand-sub">CORPORATE COMMS · 2026</div>
  </div>

  <div class="login-card">
    <div class="login-heading">مرحباً بك</div>
    <div class="login-sub">سجّل دخولك للوصول إلى منصة تواصل</div>

    <div class="alert error" id="alert-error">
      <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </span>
      <span id="alert-error-msg">خطأ في تسجيل الدخول</span>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="user-type">نوع المستخدم</label>
        <div class="field-input-wrap">
          <select id="user-type" name="userType" style="width:100%;min-height:44px;padding:12px 44px 12px 14px;font-size:14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;background:#fff;appearance:none;cursor:pointer;">
            <option value="team_member">عضو فريق التواصل المؤسسي</option>
            <option value="approved_manager">مدير معتمد</option>
            <option value="system_admin">مسؤول النظام</option>
            <option value="requester">موظف مقدّم طلب</option>
          </select>
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <div class="field-input-wrap">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@company.sa"
            autocomplete="email"
            required
          >
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="field-input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <button type="button" class="toggle-pass" id="toggle-pass" title="إظهار/إخفاء كلمة المرور">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field-options">
        <label class="checkbox-wrap">
          <input type="checkbox" id="remember-me" name="rememberMe">
          <span>تذكّرني لمدة 7 أيام</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="submit-btn">
        <span id="btn-text">دخول</span>
      </button>
    </form>

    <div id="sso-section">
      <div class="sso-divider">أو</div>
      <a href="/api/v1/auth/sso/azure/start" class="btn-sso" id="sso-btn">
        <svg class="sso-icon" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
          <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
        </svg>
        تسجيل الدخول بحساب المؤسسة
      </a>
    </div>
  </div>

  <div class="login-footer">
    بنك التواصل الداخلي — نظام داخلي محمي
  </div>
</div>

<script>
(function() {
  // Same single-configurable-base-URL mechanism as index.html (see its API CONFIG block
  // for the full rationale) — kept duplicated rather than shared via an extra <script src>
  // tag, since this file has no build step and must keep working as a single static file
  // that can be opened/served independently of index.html.
  var API_BASE = (typeof window !== 'undefined' && window.__API_BASE__) || '';
  var API_VERSION = (typeof window !== 'undefined' && window.__API_VERSION__) || 'v1';
  function apiUrl(path) { return API_BASE + '/api/' + API_VERSION + path; }

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  const rememberMe = document.getElementById('remember-me');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const alertError = document.getElementById('alert-error');
  const alertErrorMsg = document.getElementById('alert-error-msg');
  const togglePass = document.getElementById('toggle-pass');
  const eyeIcon = document.getElementById('eye-icon');

  let isLoading = false;

  togglePass.addEventListener('click', function() {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  function showError(msg) {
    alertErrorMsg.textContent = msg;
    alertError.classList.add('show');
  }
  function hideError() {
    alertError.classList.remove('show');
  }
  function setLoading(state) {
    isLoading = state;
    submitBtn.disabled = state;
    btnText.innerHTML = state
      ? '<div class="spinner"></div>'
      : 'دخول';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (isLoading) return;

    hideError();
    const email = emailInput.value.trim();
    const password = passInput.value;

    if (!email || !password) {
      showError('يرجى إدخال البريد الإلكتروني وكلمة المرور');
      return;
    }

    setLoading(true);
    try {
      const resp = await fetch(apiUrl('/auth/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password, rememberMe: rememberMe.checked }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        // New API returns application/problem+json ({title,detail}) instead of the old
        // {error} shape — prefer detail, then title, then the old key, then a fallback.
        showError(data.detail || data.title || data.error || 'خطأ في تسجيل الدخول');
        setLoading(false);
        return;
      }

      localStorage.setItem('access_token', data.accessToken);
      localStorage.setItem('user_info', JSON.stringify(data.user));
      // Persist selected user-type hint for role-based UI (Phase 6)
      var userTypeEl = document.getElementById('user-type');
      if (userTypeEl) localStorage.setItem('user_type_hint', userTypeEl.value);
      // Set JS-readable cookies so the frontend server can detect auth state.
      // access_token: mirrors the JWT (15 min) for immediate access-gating.
      // has_session:  long-lived (7 days) indicator mirroring the httpOnly
      //               refresh_token lifetime; survives access-token expiry so
      //               the server never redirects users with a valid refresh session.
      document.cookie = 'access_token=' + encodeURIComponent(data.accessToken) +
        '; path=/; SameSite=Strict; max-age=900';
      document.cookie = 'has_session=1; path=/; SameSite=Strict; max-age=604800';
      window.location.href = '/';
    } catch (err) {
      showError('خطأ في الاتصال بالخادم. حاول مجدداً.');
      setLoading(false);
    }
  });

  if (emailInput) emailInput.focus();

  const urlParams = new URLSearchParams(window.location.search);
  const ssoError = urlParams.get('sso_error');
  if (ssoError) {
    showError(decodeURIComponent(ssoError));
  }

  (async function loadSsoConfig() {
    try {
      const resp = await fetch(apiUrl('/auth/sso/config'));
      if (!resp.ok) return;
      const data = await resp.json();
      if (data.enabled) {
        const ssoSection = document.getElementById('sso-section');
        if (ssoSection) ssoSection.style.display = 'block';
      }
    } catch {
      // SSO config not critical
    }
  })();
})();
</script>
</body>
</html>
