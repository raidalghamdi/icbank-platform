name: Backend CI

on:
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  # Lets the full gate suite be run on demand against any branch before a PR exists.
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  COVERAGE_THRESHOLD: 70
  # Api + Infrastructure were widened into coverlet.runsettings' Include list and measured at
  # 87.4% line coverage (see SECURITY-HARDENING-NOTES.md for the exact run this floor is derived
  # from). 80 is set deliberately below that number, not at it: it is a floor that catches a real
  # regression without being so tight that routine, unrelated changes trip it on branch-coverage
  # noise. It must never be raised to match a lucky measurement, and never lowered to paper over
  # a regression -- if it needs to move, the number and the reason both belong in this comment.
  API_INFRASTRUCTURE_COVERAGE_THRESHOLD: 80
  # Icbank.Platform.DataMigration was added to coverlet.runsettings' Include list (it was
  # previously entirely uninstrumented -- see DATA-MIGRATION-NOTES.md "Coverage instrumentation
  # gap") and measured at 91.8% line coverage in a sandbox with no reachable SQL Server, after
  # adding a TableMigratorRegistry reflection test (every ITableMigrator implementation must be
  # registered -- the exact defect shape that shipped once for the five International Days
  # migrators), ValidationRunner tests, and SQL-Server-gated ReconciliationRunner/UserTableMigrator
  # tests that only execute their real assertions when ICBANK_TEST_SQL_CONNECTION is set (as it is
  # in this CI job). 85 is set deliberately below the measured 91.8%, not at it, for the same
  # reason as API_INFRASTRUCTURE_COVERAGE_THRESHOLD: a floor that catches a real regression
  # without tripping on routine, unrelated branch-coverage noise. It must never be raised to match
  # a lucky measurement, and never lowered to paper over a regression -- if it needs to move, the
  # number and the reason both belong in this comment.
  DATAMIGRATION_COVERAGE_THRESHOLD: 85
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_NOLOGO: 'true'

defaults:
  run:
    working-directory: backend

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'P@ssw0rd_CI_Only!'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'P@ssw0rd_CI_Only!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      # R-BE-090 — code style is not advisory
      - name: Format verification (R-BE-090)
        run: dotnet format --verify-no-changes --no-restore

      # R-BE-091 — hard 40-line-per-method gate.
      # No first-party Roslyn analyzer supports a configurable line threshold
      # as a build error; see DOTNET-CONVENTIONS.md section 8.
      - name: Method-length gate (R-BE-091)
        run: |
          pip install --quiet lizard
          # lizard emits a synthetic "*global*" entry per C# file whose reported
          # length is the whole file, not a method. Filter it out so the gate
          # measures real methods only.
          # EF Core migration files are generated code and are exempt.
          lizard --CCN 15 -L 40 -w src/ -x "*/Migrations/*" \
            | grep -v '\*global\*' > lizard.txt || true
          if [ -s lizard.txt ]; then
            cat lizard.txt
            echo "::error::Method exceeds 40 lines or CCN 15 (R-BE-091)"
            exit 1
          fi
          echo "R-BE-091 gate passed: no method over 40 lines or CCN 15."

      # R-BE-083 — a skipped test must reference a tracking ticket
      - name: No skip-to-green gate (R-BE-083)
        run: |
          if grep -rn 'Skip = "' tests/ | grep -v 'Ticket:'; then
            echo "::error::Found Skip= without a linked Ticket: trailer (R-BE-083)"
            exit 1
          fi

      - name: Build (warnings-as-errors, nullable enforced)
        run: dotnet build --no-restore -c Release

      # R-BE-076 — dependency vulnerability scan
      - name: Vulnerable package scan (R-BE-076)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE "Critical|High" vuln.txt; then
            echo "::error::Critical/High vulnerable package found (R-BE-076)"
            exit 1
          fi

      # The integration suite runs against the real SQL Server service container above.
      # ICBANK_TEST_SQL_CONNECTION is what switches AuthWebApplicationFactory off the
      # EF Core InMemory provider and onto SQL Server, where each test host applies the
      # committed migrations into a throwaway database and drops it afterwards.
      #
      # This matters: InMemory enforces no foreign keys, no unique indexes, no cascade
      # rules, no datetimeoffset(3) precision and no rowversion concurrency. A green run
      # on InMemory says the code paths execute; only a green run here says the schema
      # and its constraints actually hold.
      - name: Run tests with coverage (real SQL Server)
        run: |
          dotnet test --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --settings coverlet.runsettings
        env:
          ICBANK_TEST_SQL_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;Encrypt=False;'
          ConnectionStrings__Default: 'Server=localhost,1433;Database=IcbankPlatformTest;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;Encrypt=False;'

      # Guard against the harness silently regressing to InMemory in CI, which would make
      # every relational assertion above vacuous while the suite still reported green.
      - name: Assert tests ran against a relational provider
        run: |
          if ! grep -rq 'ICBANK_TEST_SQL_CONNECTION' tests/Icbank.Platform.IntegrationTests/Auth/AuthWebApplicationFactory.cs; then
            echo "::error::The integration test harness no longer honours ICBANK_TEST_SQL_CONNECTION, so CI is not testing against SQL Server."
            exit 1
          fi

      # R-BE-080 — coverage gate, Application + Domain (the primary, longest-standing floor)
      - name: Coverage gate (R-BE-080)
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coveragereport \
            -reporttypes:JsonSummary \
            -classfilters:"+Icbank.Platform.Application.*;+Icbank.Platform.Domain.*"
          LINE_RATE=$(jq '.summary.linecoverage' coveragereport/Summary.json)
          echo "Line coverage (Application + Domain): $LINE_RATE%"
          if (( $(echo "$LINE_RATE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $LINE_RATE% is below the ${{ env.COVERAGE_THRESHOLD }}% threshold (R-BE-080)"
            exit 1
          fi

      # Api + Infrastructure coverage gate — separate and honest, not the same number as R-BE-080.
      # These two layers used to be excluded from coverlet.runsettings entirely on the theory that
      # integration tests alone proved them; two cross-cutting response-contract defects that lived
      # in the Api layer and were only caught by a live boot test showed that theory was wrong for
      # at least some of this code. The floor below is the layers' actual measured coverage, minus
      # margin — see the API_INFRASTRUCTURE_COVERAGE_THRESHOLD comment above and
      # SECURITY-HARDENING-NOTES.md for what is and is not covered.
      - name: Coverage gate — Api + Infrastructure (separate honest floor)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coveragereport-apiinfra \
            -reporttypes:JsonSummary \
            -classfilters:"+Icbank.Platform.Api.*;+Icbank.Platform.Infrastructure.*"
          LINE_RATE=$(jq '.summary.linecoverage' coveragereport-apiinfra/Summary.json)
          echo "Line coverage (Api + Infrastructure): $LINE_RATE%"
          if (( $(echo "$LINE_RATE < ${{ env.API_INFRASTRUCTURE_COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $LINE_RATE% is below the ${{ env.API_INFRASTRUCTURE_COVERAGE_THRESHOLD }}% Api+Infrastructure threshold"
            exit 1
          fi

      # DataMigration coverage gate — separate and honest, not the same number as R-BE-080 or the
      # Api+Infrastructure gate above. This tool moves production data with no reversible undo; a
      # migrator that compiles, has its own transformer unit tests, and is simply never registered
      # reports success while migrating zero rows (see DATA-MIGRATION-NOTES.md — this exact defect
      # shipped once for the five International Days migrators). The floor below is the layer's
      # actual measured coverage, minus margin — see the DATAMIGRATION_COVERAGE_THRESHOLD comment
      # above for what is and is not covered.
      - name: Coverage gate — DataMigration (separate honest floor)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coveragereport-datamigration \
            -reporttypes:JsonSummary \
            -classfilters:"+Icbank.Platform.DataMigration.*"
          LINE_RATE=$(jq '.summary.linecoverage' coveragereport-datamigration/Summary.json)
          echo "Line coverage (DataMigration): $LINE_RATE%"
          if (( $(echo "$LINE_RATE < ${{ env.DATAMIGRATION_COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $LINE_RATE% is below the ${{ env.DATAMIGRATION_COVERAGE_THRESHOLD }}% DataMigration threshold"
            exit 1
          fi

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coveragereport
            backend/coveragereport-apiinfra
            backend/coveragereport-datamigration

  # Everything in the job above runs the app in-process through WebApplicationFactory with
  # the database and clock swapped out. This job is the only place the API runs as a real
  # process, against a real database, answering over a real socket - which is what proves
  # the DI graph, configuration binding, migrations, middleware order and response
  # pipeline actually work. An app can hold every test green and still fail to start.
  smoke-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'P@ssw0rd_CI_Only!'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'P@ssw0rd_CI_Only!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install -g dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Boot the API and assert live HTTP behaviour
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          ICBANK_SMOKE_CONNECTION: 'Server=localhost,1433;Database=IcbankSmoke;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;Encrypt=False;'
