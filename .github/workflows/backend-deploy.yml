name: Backend CD

# Manual dispatch only, on purpose: this pipeline was written and validated (bicep build,
# YAML parse, gate suite) without any live Azure access -- see docs/DEPLOYMENT.md
# "Unverified without a live subscription". Wiring it to auto-fire on every push to main
# before a human has watched it succeed once against the real tenant would turn an unverified
# assumption into an unattended production deploy. Once the operator has run this manually
# against staging/prod and confirmed the OIDC federation, migration step, and smoke test all
# behave as documented, switching the `on:` block to `push: branches: [main]` is a one-line
# change they can make with confidence.
on:
  workflow_dispatch:
    inputs:
      environment:
        # Only dev is offered because only dev exists. The repository has GitHub Environments
        # named dev, Preview and Production, and Azure holds exactly one set of resources
        # (rg-icbank-dev). Offering staging and prod here was not merely useless, it was unsafe:
        # environment-scoped variables fall back to repository-level ones when the environment
        # does not define its own, and the repository-level values all point at dev. Selecting
        # "prod" therefore deployed to dev, ran migrations against the dev database, smoke-tested
        # dev, and reported success -- a green "production deploy" that never touched production.
        #
        # Add an option back only together with its Azure resources and an environment holding
        # its own APP_SERVICE_NAME, SQL_SERVER_FQDN, AZURE_RESOURCE_GROUP and
        # FRONTEND_APP_SERVICE_NAME. The preflight job below enforces that pairing.
        description: 'Target environment. Only dev is provisioned; see docs/CD-ACTIVATION.md before adding another.'
        type: choice
        required: true
        options: [dev]

env:
  DOTNET_VERSION: '8.0.423'
  COVERAGE_THRESHOLD: 70

defaults:
  run:
    working-directory: backend

# Auth: publish profile for the App Service, SQL login for the migrations. OIDC would be the
# better pattern and this workflow was written for it, but it needs an Azure AD app registration
# with a federated credential and nobody on the project holds the directory rights to create
# one -- so the pipeline never completed a run and the backend was deployed by hand instead.
#
# Both credentials are long-lived, which is the real cost. Both are narrowly scoped (one App
# Service; one database login that the app already uses) and both are rotatable without
# touching Azure AD: Deployment Center -> Manage publish profile -> Reset, and a password reset
# on the SQL login. If the app registration is ever created, restore `permissions: id-token:
# write`, put azure/login back, and delete AZURE_API_PUBLISH_PROFILE and SQL_CONNECTION_STRING.
permissions:
  contents: read

jobs:
  # Refuses to run when the chosen environment has not been given resources of its own.
  #
  # GitHub resolves `vars.X` from the environment first and the repository second, with no
  # warning when it falls through. Every repository-level value here names a dev resource, so a
  # target lacking its own variables does not fail -- it quietly becomes dev. This job asserts
  # that each resolved name actually carries the target's own token, which is true for dev today
  # (icbank-dev-api, icbank-dev-sql..., rg-icbank-dev) and false for anything that inherited
  # them. It costs seconds and runs before the SQL service container starts.
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # No checkout in this job, so the workflow-level `working-directory: backend` would leave
      # bash unable to start at all.
      - name: Confirm the target owns its resources
        working-directory: ${{ github.workspace }}
        env:
          TARGET: ${{ inputs.environment }}
          APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
          FRONTEND_APP_SERVICE_NAME: ${{ vars.FRONTEND_APP_SERVICE_NAME }}
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          failed=0
          for name in APP_SERVICE_NAME FRONTEND_APP_SERVICE_NAME SQL_SERVER_FQDN AZURE_RESOURCE_GROUP; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set for environment '$TARGET'."
              failed=1
              continue
            fi
            case "$value" in
              *-"$TARGET"-*|*-"$TARGET")
                echo "  ok   $name = $value"
                ;;
              *)
                echo "::error::$name resolves to '$value', which is not a '$TARGET' resource."
                echo "::error::Environment '$TARGET' has no $name of its own, so the repository-level value was used."
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to deploy: '$TARGET' would be deployed onto another environment's resources."
            exit 1
          fi
          echo "All four resource names belong to '$TARGET'."

  # Every gate the CI workflow enforces on a PR is re-run here before anything is deployed.
  # A pipeline that deploys code no gate has verified is worse than no pipeline at all.
  gate:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'P@ssw0rd_CI_Only!'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'P@ssw0rd_CI_Only!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Format verification (R-BE-090)
        run: dotnet format --verify-no-changes --no-restore

      - name: Method-length gate (R-BE-091)
        run: |
          pip install --quiet lizard
          lizard --CCN 15 -L 40 -w src/ -x "*/Migrations/*" \
            | grep -v '\*global\*' > lizard.txt || true
          if [ -s lizard.txt ]; then
            cat lizard.txt
            echo "::error::Method exceeds 40 lines or CCN 15 (R-BE-091)"
            exit 1
          fi

      - name: No skip-to-green gate (R-BE-083)
        run: |
          if grep -rn 'Skip = "' tests/ | grep -v 'Ticket:'; then
            echo "::error::Found Skip= without a linked Ticket: trailer (R-BE-083)"
            exit 1
          fi

      - name: Build (warnings-as-errors, nullable enforced)
        run: dotnet build --no-restore -c Release

      - name: Vulnerable package scan (R-BE-076)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE "Critical|High" vuln.txt; then
            echo "::error::Critical/High vulnerable package found (R-BE-076)"
            exit 1
          fi

      - name: Run tests with coverage (real SQL Server)
        run: |
          dotnet test --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --settings coverlet.runsettings
        env:
          ICBANK_TEST_SQL_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;Encrypt=False;'
          ConnectionStrings__Default: 'Server=localhost,1433;Database=IcbankPlatformTest;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;Encrypt=False;'

      - name: Coverage gate (R-BE-080)
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coveragereport \
            -reporttypes:JsonSummary \
            -classfilters:"+Icbank.Platform.Application.*;+Icbank.Platform.Domain.*"
          LINE_RATE=$(jq '.summary.linecoverage' coveragereport/Summary.json)
          echo "Line coverage (Application + Domain): $LINE_RATE%"
          if (( $(echo "$LINE_RATE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage $LINE_RATE% is below the ${{ env.COVERAGE_THRESHOLD }}% threshold (R-BE-080)"
            exit 1
          fi

      - name: Publish the app
        run: dotnet publish src/Icbank.Platform.Api -c Release --no-build -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/publish
          retention-days: 7

  # Migrations are applied as their own explicit step against the real target database, never
  # as an app-startup side effect -- an app that silently migrates its own database on boot can
  # apply a destructive schema change to production the moment a new instance happens to start,
  # with no gate, review, or rollback point in between.
  migrate:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No azure/login here any more. This pipeline never completed a single run: it failed at
      # azure/login with "Not all values are present. Ensure 'client-id' and 'tenant-id' are
      # supplied", because the OIDC secrets were never created -- that needs an Azure AD app
      # registration with a federated credential and nobody on the project holds the directory
      # rights to make one. The backend was being deployed by hand instead.
      #
      # The comment that used to sit on the migration step said azureADOnlyAuthentication was
      # true and so no SQL credential could exist. That is not true of this environment:
      # icbank-dev-sql has azureADOnlyAuthentication = false, and the running API authenticates
      # with a SQL login today. So migrations can use the same SQL credential the app uses,
      # with no directory rights involved.
      - name: Confirm the runner can reach SQL before doing anything
        run: |
          # GitHub-hosted runners are themselves Azure-hosted, so the server's
          # AllowAllWindowsAzureIps rule normally covers them and no per-run firewall opening is
          # needed. "Normally" is doing work in that sentence, so fail here with an explanation
          # rather than 40 lines later inside dotnet ef.
          python3 - <<'PROBE'
          import socket, sys, urllib.request
          host = "${{ vars.SQL_SERVER_FQDN }}"
          if not host:
              sys.exit("SQL_SERVER_FQDN repository variable is not set")
          try:
              with socket.create_connection((host, 1433), timeout=20):
                  print(f"TCP 1433 to {host} is open")
          except OSError as exc:
              ip = urllib.request.urlopen("https://api.ipify.org", timeout=20).read().decode()
              sys.exit(
                  f"::error::cannot reach {host}:1433 from this runner ({ip}): {exc}\n"
                  f"Add a firewall rule for the runner, or confirm 'Allow Azure services and "
                  f"resources to access this server' is enabled on icbank-dev-sql."
              )
          PROBE

      - name: Restore and build (no-op if cached, needed for dotnet ef)
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install -g dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF Core migrations to the target database
        run: |
          dotnet ef database update \
            --project src/Icbank.Platform.Infrastructure \
            --startup-project src/Icbank.Platform.Api \
            --no-build --configuration Release
        env:
          # The same SQL login the running API uses. Held as a secret rather than assembled from
          # variables because it carries a password. If this environment is ever moved to
          # Entra-only auth, this goes back to 'Authentication=Active Directory Default' and the
          # job needs an identity with db_ddladmin -- see docs/DEPLOYMENT.md.
          ConnectionStrings__Default: ${{ secrets.SQL_CONNECTION_STRING }}


  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      app-url: ${{ steps.resolve-url.outputs.app_url }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: publish

      - name: Resolve the deployed app URL
        id: resolve-url
        # Derived, not queried: `az webapp show` needs an authenticated CLI and this job no
        # longer logs in to Azure. App Service always assigns <name>.azurewebsites.net. A custom
        # domain would have to become a repository variable.
        #
        # working-directory is overridden because the workflow sets `backend` as the default for
        # every run step, and this job never checks the repository out -- it only downloads the
        # publish artifact, so backend/ does not exist here and bash cannot start. The step this
        # replaced had the same defect and would have failed the same way; nobody found out
        # because azure/login failed first and the job never reached it.
        working-directory: ${{ github.workspace }}
        run: echo "app_url=https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net" >> "$GITHUB_OUTPUT"

  # The gate job proves the code is correct in isolation (WebApplicationFactory, swapped
  # database/clock). This job is the only place that proves the actual deployed instance -- real
  # App Service configuration, real Key Vault references, real managed identity, real SQL
  # connectivity -- answers live traffic correctly. A deploy that fails this is rolled back
  # (see docs/DEPLOYMENT.md "Rollback"), not left in place "to investigate later".
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # The smoke script starts asserting immediately, and App Service does not finish a slot
      # swap the moment the deploy step returns. On the release that added the observance
      # seeder, every assertion came back 500 -- including ones that only expect a 404 -- and
      # the run went red. Re-running the same job minutes later passed with nothing changed.
      #
      # /health/ready alone does not settle this: it was already answering 200 while the rest
      # of the pipeline still 500'd. So this waits for a route that should NOT exist to return
      # a clean 404, which only happens once routing, the error contract and the middleware
      # chain are all live.
      - name: Wait for the deployed instance to finish starting
        working-directory: ${{ github.workspace }}
        env:
          BASE: ${{ needs.deploy.outputs.app-url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            ready=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/health/ready" || echo 000)
            routed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/v1/__startup_probe__" || echo 000)
            if [ "$ready" = "200" ] && [ "$routed" = "404" ]; then
              echo "instance answering correctly after ${i} attempt(s) (~$((i*10))s)"
              exit 0
            fi
            echo "attempt $i: /health/ready=$ready, unknown-route=$routed (want 200 and 404) — retrying in 10s"
            sleep 10
          done
          echo "::error::Deployed instance never started answering correctly within ~7 minutes"
          exit 1

      - name: Run smoke assertions against the deployed instance
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.app-url }}
          SMOKE_SEED_EMAIL: ${{ secrets.SMOKE_SEED_EMAIL }}
          SMOKE_SEED_PASSWORD: ${{ secrets.SMOKE_SEED_PASSWORD }}
