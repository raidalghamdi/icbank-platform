name: Frontend CD

# Manual dispatch only, matching Backend CD. This pipeline has not been run against a live
# Azure tenant from this repository, so wiring it to fire on every push would turn an
# unverified assumption into an unattended deploy. Once an operator has watched it succeed
# once against dev, switching the `on:` block to `push: branches: [main]` with a
# `paths: [artifacts/internal-comms/**]` filter is a one-line change.
on:
  workflow_dispatch:
    inputs:
      environment:
        # Only dev is offered because only dev exists, and offering more was unsafe rather than
        # merely useless -- see the matching note in backend-deploy.yml. Environment variables
        # fall back to repository-level ones silently, and every repository-level value names a
        # dev resource, so picking "prod" republished the dev site and called it a production
        # deploy. The preflight job refuses that.
        description: 'Target environment. Only dev is provisioned; see docs/CD-ACTIVATION.md before adding another.'
        type: choice
        required: true
        options: [dev]

# Auth: publish profile, deliberately, despite OIDC being the stronger pattern.
#
# OIDC needs an Azure AD app registration with a federated credential, and creating one
# requires directory permissions nobody on this project has been able to apply. The result was
# that CD sat unusable for weeks while the frontend was deployed by hand. A publish profile is
# a long-lived credential and that is a real downside -- but it is scoped to this one App
# Service, it is revocable in one click from the portal (Deployment Center -> Manage publish
# profile -> Reset), and it needs no directory rights at all.
#
# If the AD app registration ever does get created, switching back is: restore the
# permissions/id-token block, swap the deploy step for azure/login + `az webapp deploy`, and
# delete the AZURE_WEBAPP_PUBLISH_PROFILE secret.
permissions:
  contents: read

env:
  FRONTEND_DIR: artifacts/internal-comms

jobs:
  # Mirrors backend-deploy.yml: refuse a target that would inherit another environment's
  # resources. The frontend only needs the one variable it actually deploys to.
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Confirm the target owns its resources
        env:
          TARGET: ${{ inputs.environment }}
          FRONTEND_APP_SERVICE_NAME: ${{ vars.FRONTEND_APP_SERVICE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_APP_SERVICE_NAME:-}" ]; then
            echo "::error::FRONTEND_APP_SERVICE_NAME is not set for environment '$TARGET'."
            exit 1
          fi
          case "$FRONTEND_APP_SERVICE_NAME" in
            *-"$TARGET"-*|*-"$TARGET")
              echo "FRONTEND_APP_SERVICE_NAME = $FRONTEND_APP_SERVICE_NAME belongs to '$TARGET'."
              ;;
            *)
              echo "::error::FRONTEND_APP_SERVICE_NAME resolves to '$FRONTEND_APP_SERVICE_NAME', which is not a '$TARGET' resource."
              echo "::error::Environment '$TARGET' defines no value of its own, so the repository-level one was used."
              echo "::error::Refusing to publish '$TARGET' over another environment's site."
              exit 1
              ;;
          esac

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      app-url: ${{ steps.resolve-url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      # The frontend is static HTML served by a dependency-free Node server, so there is no
      # install or build step to run. What there IS to check is that the inline scripts parse:
      # a syntax error in index.html would deploy a blank page that still returns HTTP 200,
      # which no smoke test hitting "/" would catch.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check the server and every inline script block
        run: |
          cd "$FRONTEND_DIR"
          node --check server.mjs
          node - <<'EOF'
          const fs = require('fs');
          const vm = require('vm');
          let failed = 0;
          for (const file of ['index.html', 'login.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = html.match(/<script(?![^>]*\bsrc=)[^>]*>[\s\S]*?<\/script>/g) || [];
            blocks.forEach((raw, i) => {
              const body = raw.replace(/^<script[^>]*>/, '').replace(/<\/script>$/, '');
              try {
                new vm.Script(body, { filename: `${file}#script[${i}]` });
              } catch (err) {
                console.error(`::error file=${file}::inline script ${i} failed to parse: ${err.message}`);
                failed++;
              }
            });
            console.log(`${file}: ${blocks.length} inline script block(s) checked`);
          }
          if (failed) process.exit(1);
          EOF

      # Parsing is not the only thing that can be wrong and still return HTTP 200. authCanView()
      # decides which pages a signed-in user may open, and it spent a long release hardcoding
      # `true` for seven of them -- the live smoke checks never noticed, because they sign in as
      # a super admin, who is allowed everything by design and so cannot observe a bypass.
      - name: Check page permissions are decided by the matrix
        run: |
          cd "$FRONTEND_DIR"
          node tools/authcanview.test.mjs

      - name: Package the site
        run: |
          cd "$FRONTEND_DIR"
          zip -rq "$GITHUB_WORKSPACE/frontend.zip" . -x '*.git*' 'node_modules/*'
          unzip -l "$GITHUB_WORKSPACE/frontend.zip" | tail -1

      # The startup command is set on the App Service itself ("node server.mjs") and persists
      # across deploys, so there is no az step here. It matters because App Service's Node
      # autodetect runs `npm start`, and this package.json has no start script -- without it the
      # container serves the directory statically and every deep link 404s instead of reaching
      # the shell fallback in server.mjs. If the app is ever recreated from scratch, set it
      # again under Configuration -> General settings -> Startup Command.
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FRONTEND_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend.zip

      # Derived rather than looked up: `az webapp show` needs an authenticated CLI, and this
      # job no longer logs in to Azure. The default hostname of an App Service is always
      # <name>.azurewebsites.net, so there is nothing to query. A custom domain would need
      # this to become a variable.
      - name: Resolve the deployed app URL
        id: resolve-url
        run: echo "app_url=https://${{ vars.FRONTEND_APP_SERVICE_NAME }}.azurewebsites.net" >> "$GITHUB_OUTPUT"

  # server.mjs streams both HTML files to the client verbatim (res.end(data), no templating),
  # so "did the deploy actually land" is answerable exactly: sha256 of the served body must
  # equal sha256 of the committed file. A status-code smoke test cannot tell a fresh deploy
  # from a stale container still serving the previous build.
  verify-live-bytes:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # Waiting on "200 from /login" was wrong, and it produced a false green followed by a
      # false red: App Service keeps serving the PREVIOUS container until the new one is
      # warm, and the previous container answers 200 perfectly well. So the byte comparison
      # below would run against the old build -- passing if the deploy changed nothing,
      # failing loudly if it did. The only reliable readiness signal is the artefact itself,
      # so poll until the served login page IS the committed one.
      - name: Wait for the new build to actually be serving
        run: |
          BASE="${{ needs.deploy.outputs.app-url }}"
          WANT=$(sha256sum "$FRONTEND_DIR/login.html" | cut -d' ' -f1)
          for i in $(seq 1 40); do
            curl -sS "$BASE/login" -o live.out 2>/dev/null || true
            GOT=$(sha256sum live.out 2>/dev/null | cut -d' ' -f1)
            if [ "$GOT" = "$WANT" ]; then
              echo "new build live after ${i} attempt(s) (~$((i*10))s)"
              exit 0
            fi
            echo "attempt $i: serving ${GOT:0:12}, want ${WANT:0:12} — retrying in 10s"
            sleep 10
          done
          echo "::error::Deployed build never became live within ~7 minutes"
          exit 1

      - name: Confirm the live bytes match the committed files
        run: |
          BASE="${{ needs.deploy.outputs.app-url }}"
          FAILED=0

          check() {
            local label="$1" url="$2" localfile="$3"; shift 3
            # "$@" carries any extra curl args (e.g. the session cookie for "/")
            curl -sS --fail-with-body "$@" "$url" -o live.out
            local live_sum local_sum
            live_sum=$(sha256sum live.out | cut -d' ' -f1)
            local_sum=$(sha256sum "$localfile" | cut -d' ' -f1)
            if [ "$live_sum" = "$local_sum" ]; then
              echo "OK   $label — $(wc -c < live.out) bytes, sha256 ${live_sum:0:12}"
            else
              echo "::error::$label does not match $localfile"
              echo "  live  $(wc -c < live.out) bytes  sha256 $live_sum"
              echo "  local $(wc -c < "$localfile") bytes  sha256 $local_sum"
              FAILED=1
            fi
          }

          # "/" is behind a server-side session gate that only checks for the PRESENCE of a
          # cookie (see the auth gate in server.mjs), so a dummy value is enough to fetch the
          # shell here. No real credential belongs in a CI log.
          check "GET /login" "$BASE/login" "$FRONTEND_DIR/login.html"
          check "GET /"      "$BASE/"      "$FRONTEND_DIR/index.html" -H 'Cookie: has_session=1'

          exit $FAILED

      # Added after a real escape: the auth gate 302'd every unauthenticated request that was
      # not on a short allowlist, and the allowlist omitted /css and /fonts. So the sign-in
      # page -- the one screen every user sees before anything else -- loaded with no
      # stylesheet and no webfont and rendered in an OS fallback face, while the whole branch
      # existed to guarantee the approved face. The Playwright harness could not see it: it
      # runs against proxy.mjs, which has no auth gate. This runs against the deployed site
      # signed out, which is the only place the bug exists.
      - name: Assert brand assets load before sign-in
        run: |
          BASE="${{ needs.deploy.outputs.app-url }}"
          FAILED=0

          for ASSET in /css/dga.css \
                       /fonts/frutiger/FrutigerLTArabic-Roman.woff2 \
                       /fonts/frutiger/FrutigerLTArabic-Bold.woff2; do
            CODE=$(curl -s -o asset.out -w '%{http_code}' "$BASE$ASSET")
            if [ "$CODE" != "200" ]; then
              echo "::error::$ASSET returned $CODE while signed out (must be 200)"
              FAILED=1
              continue
            fi
            # A 302 body or an HTML error page would still be "200 with bytes", so for the
            # fonts check the actual wOF2 magic number rather than trusting the status line.
            case "$ASSET" in
              *.woff2)
                if [ "$(head -c 4 asset.out)" != "wOF2" ]; then
                  echo "::error::$ASSET is not a woff2 payload"
                  FAILED=1
                else
                  echo "OK   $ASSET — $(wc -c < asset.out) bytes, wOF2"
                fi
                ;;
              *) echo "OK   $ASSET — $(wc -c < asset.out) bytes" ;;
            esac
          done

          # ...and the gate must still gate. If this ever returns 200 the allowlist has been
          # widened too far and the app shell is public.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/index.html")
          if [ "$CODE" != "302" ]; then
            echo "::error::/index.html returned $CODE signed out; expected a 302 to /login"
            FAILED=1
          else
            echo "OK   /index.html still gated"
          fi

          exit $FAILED

      # Guards the two things this release actually changed, so a future regression that
      # reverts either one fails the pipeline rather than shipping quietly.
      - name: Assert the release invariants are present in the served shell
        run: |
          BASE="${{ needs.deploy.outputs.app-url }}"
          curl -sS -H 'Cookie: has_session=1' "$BASE/" -o shell.html
          FAILED=0

          # Collapsible nav groups: six real buttons carrying persistence keys.
          COUNT=$(grep -o 'data-group-key=' shell.html | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::expected 6 collapsible nav groups, served shell has $COUNT"
            FAILED=1
          else
            echo "OK   6 collapsible nav groups"
          fi

          # The off-canvas drawer must be parked with a transform, not a negative offset:
          # a negative offset enlarges the scroll area and widens the mobile layout viewport.
          if grep -q 'right: -300px' shell.html; then
            echo "::error::sidebar is parked with a negative offset again (regression)"
            FAILED=1
          else
            echo "OK   drawer parked with a transform"
          fi

          for needle in 'icbank.nav.groups.v1' 'max-width: 1023.98px' 'tbl-cards'; do
            if grep -qF "$needle" shell.html; then
              echo "OK   found $needle"
            else
              echo "::error::served shell is missing $needle"
              FAILED=1
            fi
          done

          exit $FAILED
